[package]
name = "photocraft-cli"
description = "Headless Capishot: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional photocraft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photocraft-codecs/heif"]
# `edit.inpaintAi` (Manga LaMa) on this machine: wgpu GPU, else the CPU. Not default: it adds burn
# to the build. Weights: CAPISHOT_LAMA_WEIGHTS or <config dir>/models/manga-lama-f16.safetensors.
ai = ["dep:photocraft-ai-lama"]

[lints]
workspace = true

[lib]
name = "photocraft_cli"
path = "src/lib.rs"

[[bin]]
name = "capishot-cli"
path = "src/main.rs"

[dependencies]
photocraft-ai-lama = { workspace = true, optional = true, features = ["flex", "wgpu", "rayon"] }
photocraft-automation = { path = "../../crates/automation" }
photocraft-engine = { workspace = true, features = ["plugins"] }
photocraft-fontfetch = { workspace = true }
photocraft-io = { workspace = true, features = ["camera-raw"] }
photocraft-format = { path = "../../crates/format" }
photocraft-codecs = { workspace = true, features = ["exr"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for photocraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

