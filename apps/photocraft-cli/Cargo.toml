[package]
name = "photocraft-cli"
description = "Headless Capishot: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional photocraft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photocraft-codecs/heif"]
# Image › Upscale with AI (photocraft-ai) and Edit › Clean with AI / the Remove tool's AI mode
# (photocraft-ai-lama) in-process: wgpu GPU, else the CPU. Opt-in: it adds burn to the build.
# Weights: the AI Model Manager downloads them (%LOCALAPPDATA%\Capishot\models on Windows,
# <config dir>/ai-models elsewhere); CAPISHOT_LAMA_WEIGHTS points LaMa at another file.
ai = ["dep:photocraft-ai", "photocraft-ai/gpu", "photocraft-ai/cpu", "photocraft-ai/download", "dep:photocraft-ai-lama", "dep:photocraft-ai-sd"]

[lints]
workspace = true

[lib]
name = "photocraft_cli"
path = "src/lib.rs"

[[bin]]
name = "capishot-cli"
path = "src/main.rs"

[dependencies]
photocraft-ai = { workspace = true, optional = true }
photocraft-ai-lama = { workspace = true, optional = true, features = ["flex", "wgpu", "rayon"] }
photocraft-ai-sd = { workspace = true, optional = true, features = ["flex", "wgpu", "rayon", "native"] }
photocraft-automation = { path = "../../crates/automation" }
photocraft-engine = { workspace = true, features = ["plugins"] }
photocraft-fontfetch = { workspace = true }
photocraft-io = { workspace = true, features = ["camera-raw"] }
photocraft-format = { path = "../../crates/format" }
photocraft-codecs = { workspace = true, features = ["exr"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for photocraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

