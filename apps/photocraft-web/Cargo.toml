[package]
name = "photocraft-web"
description = "Capishot in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Open HEIC/HEIF photos (the optional photocraft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photocraft-codecs/heif"]
# The browser build leaves out what a web user rarely needs and the download pays for on every
# visit: OpenEXR (`photocraft-codecs/exr`), camera raw development (`photocraft-io/camera-raw`;
# raws open as their embedded JPEG preview), WebAssembly filter plug-ins (`photocraft-ui-egui/plugins`),
# HEIC/HEIF (`heif`, no longer in index.html or packaging/web-threads/build.sh), and the
# translation catalogs other than Spanish and Brazilian Portuguese, fetched from `i18n/` when
# chosen (`photocraft-ui-egui/all-catalogs`). `full` puts them all back.
full = ["heif", "photocraft-codecs/exr", "photocraft-io/camera-raw", "photocraft-ui-egui/plugins", "photocraft-ui-egui/all-catalogs"]

[lints]
workspace = true

[[bin]]
name = "photocraft-web"
path = "src/main.rs"

[dependencies]
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
photocraft-compose = { workspace = true }
# Image › Upscale with AI: the upscaler seam the AI worker bridge implements (no inference here).
photocraft-ai = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
# Inline `data:` images in copied HTML (src/clipboard_data.rs).
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The embedding API (src/embed.rs, src/embed_protocol.rs).
photocraft-format = { workspace = true }
serde_json = { workspace = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "Storage", "Event", "EventTarget", "AddEventListenerOptions", "KeyboardEvent", "WheelEvent", "MouseEvent", "PointerEvent", "BeforeUnloadEvent", "AbortController", "AbortSignal", "DomException", "Response", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbCursor", "IdbCursorWithValue", "RequestInit", "Navigator", "CustomEvent", "CustomEventInit", "MessageEvent", "RequestCredentials", "Performance", "ClipboardEvent", "DataTransfer", "DataTransferItemList", "DataTransferItem", "File", "DomRect", "HtmlInputElement", "FileList", "DomStringList", "Worker", "WorkerOptions", "WorkerType", "ErrorEvent", "CacheStorage", "Cache"] }

[dev-dependencies]
photocraft-format = { workspace = true }
serde_json = { workspace = true }
photocraft-paint = { workspace = true }
photocraft-psd = { workspace = true }

# Threads build (packaging/web-threads): shared memory and a Web Worker rayon pool. `web_spin_lock`
# makes rayon spin instead of block on the browser's main thread, which must never block.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = { workspace = true, features = ["web_spin_lock"] }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
