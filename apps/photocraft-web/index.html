<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Capishot</title>
  <link data-trunk rel="icon" href="../../assets/app-icon/hicolor/64x64/apps/ai.storyteller.photocraft.png" />
  <!-- Translation catalogs not compiled in (photocraft-ui-egui `all-catalogs`), fetched when chosen. -->
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/ja.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/zh-hans.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/zh-hant.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/ru.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/uk.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/cs.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/fr.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/id.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/ko.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/pl.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/de.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/el.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/nl.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/it.tsv" data-target-path="i18n" />
  <link data-trunk rel="copy-file" href="../../crates/ui-egui/src/i18n/LICENSE-translations.txt" data-target-path="i18n" />
  <link data-trunk rel="rust" data-bin="photocraft-web" data-cargo-profile="wasm-release" data-wasm-opt="z" data-weak-refs />
  <style>
    /* The notch and home indicator (viewport-fit=cover): the app keeps its bars inside these (safe_area.rs). */
    :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <p>Loading Capishot&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If Capishot doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
