[package]
name = "photocraft-ai-worker"
description = "Capishot's AI Web Worker: a separately loaded wasm module that runs photocraft-ai models on WebGPU (CPU fallback), downloads and caches their weights"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "photocraft-ai-worker"
path = "src/main.rs"

# Everything is wasm-only: natively this is an empty binary, so workspace builds don't compile
# the inference stack for it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# burn's rand needs a randomness source on wasm32-unknown-unknown (wgpu enables it otherwise).
getrandom = { version = "0.4", features = ["wasm_js"] }
# Downloads are hashed chunk by chunk as they arrive.
sha2 = "0.10"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "WorkerGlobalScope", "WorkerNavigator", "MessageEvent", "CacheStorage", "Cache", "Request", "Response", "ResponseInit", "ReadableStream", "ReadableStreamDefaultReader", "ReadableStreamReadResult", "Headers", "Blob", "Performance", "console"] }

# The plain worker: WebGPU, else the CPU on one thread (SIMD128).
[target.'cfg(all(target_arch = "wasm32", not(target_feature = "atomics")))'.dependencies]
photocraft-ai = { workspace = true, features = ["gpu", "cpu"] }
photocraft-ai-lama = { workspace = true, features = ["wgpu", "flex", "rayon"] }
photocraft-ai-sd = { workspace = true, features = ["wgpu", "flex"] }

# The threads variant (packaging/web-ai/build.sh, for cross-origin isolated pages): CPU only
# (wgpu's WebGPU objects aren't Send, so it doesn't build with shared memory), with a rayon pool
# of nested Web Workers for the kernels. The AI worker is not the page's main thread, so rayon
# may block here (no `web_spin_lock`).
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
photocraft-ai = { workspace = true, features = ["cpu"] }
photocraft-ai-lama = { workspace = true, features = ["flex", "rayon"] }
photocraft-ai-sd = { workspace = true, features = ["flex", "rayon"] }
rayon = { workspace = true }
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
