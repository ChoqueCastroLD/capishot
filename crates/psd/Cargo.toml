[package]
name = "photocraft-psd"
description = "Faithful, lossless reader and writer for Adobe Photoshop PSD (v1) and PSB (v2) files"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "photocraft_psd"
path = "src/lib.rs"

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
default = []
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = { workspace = true }
flate2 = { workspace = true }
serde = { workspace = true, optional = true }

# The browser threads build (wasm with `atomics`, packaging/web-threads) packs RLE rows on rayon.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
photocraft-psd = { path = ".", features = ["testgen"] }

[lints]
workspace = true
