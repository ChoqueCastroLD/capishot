[package]
name = "photocraft-ai-lama"
description = "LaMa (Fast Fourier Convolution) inpainting for manga and scanlation cleaning, on burn (WebGPU/wgpu or CPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "photocraft_ai_lama"
path = "src/lib.rs"

[features]
# Without features only the tiling half is built (`tiles`, `dft`): no ML dependency, so the
# editor's main module can plan and paste tiles without linking burn.
default = []
# The generator (`Lama`) on burn; pick a backend below.
model = ["dep:burn", "dep:safetensors", "dep:half"]
# Pure-Rust CPU backend (burn-flex): runs everywhere, wasm included.
flex = ["model", "burn/flex", "burn/simd"]
# GPU through wgpu: Vulkan/Metal/DX12 natively, WebGPU in the browser.
wgpu = ["model", "burn/wgpu"]
# Multithreaded CPU kernels (native, or the wasm threads build).
rayon = ["model", "burn/rayon"]
# Windows: Manga LaMa in fp32 on DirectML through ONNX Runtime (13-19x faster than burn's fp32
# convolutions on wgpu, same results), loaded at run time: `onnxruntime.dll` (a DirectML build,
# 1.24 or later) and `DirectML.dll` next to the executable or in PHOTOCRAFT_AI_ONNXRUNTIME.
# Without them, and on every other platform, the burn path runs. Never in a wasm build.
directml = ["model", "dep:ort"]

[dependencies]
burn = { version = "0.22.0", default-features = false, features = ["std"], optional = true }
safetensors = { version = "0.8", default-features = false, features = ["alloc"], optional = true }
half = { version = "2", optional = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Dynamically loaded (no download at build time, nothing linked): see the `directml` feature.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"], optional = true }

[dev-dependencies]
image = { workspace = true, features = ["png"] }
# The GPU-limit tests (feature `wgpu`) bring a device up by hand.
pollster = "1"

[lints]
workspace = true

[[example]]
name = "lama"
required-features = ["model"]

[[example]]
name = "inpaint_compare"
required-features = ["model"]
