[package]
name = "photocraft-codecs"
description = "Symmetric, depth- and metadata-preserving codecs for flat raster image formats"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Real-file corpus tests (opt-in; `cargo xtask test-corpus`). Fail when the corpus is missing.
corpus = []
# OpenEXR (flat, multi-part, deep, Cryptomatte) via the `exr` crate. On by default; the web build
# leaves it out (apps/photocraft-web), where EXR files are recognised and refused with a clear
# "not included in this build" error.
default = ["exr"]
exr = ["dep:exr"]
# AVIF *encode* via ravif and rav1e (pure Rust, no nasm). Decoding AVIF needs dav1d (C), so AVIF
# stays read-unsupported and therefore asymmetric. Off by default; the apps (desktop, CLI, web)
# turn it on.
avif = ["dep:ravif"]
# HEIC/HEIF decode via the optional photocraft-heif crate (heic-decoder, pure Rust). Off by default so
# distributors choose it at build time; official builds and CI enable it (`--features heif` on the
# apps). Without it HEIF files are still recognised and opening one is a clear "unsupported" error.
heif = ["dep:photocraft-heif"]

[dependencies]
thiserror.workspace = true
image = { workspace = true, features = ["gif", "bmp", "tga", "ico", "qoi", "hdr"] }
png = "0.18"
tiff = { version = "0.11", default-features = false, features = ["deflate", "fax", "jpeg", "lzw"] }
exr = { version = "1.73", default-features = false, optional = true }
half = "2"
serde_json.workspace = true
flate2.workspace = true
image-webp = "0.2"
zune-jpeg = "0.5"
zune-core = "0.5"
jpeg-encoder = "0.7"
# 12-bit and arithmetic-coded JPEG, which zune-jpeg does not decode.
craft-jpeg.workspace = true
photocraft-heif = { path = "../heif", optional = true }
# Without `asm` (nasm) or `threading`: the targets below add the rayon tiles where there are threads.
ravif = { version = "0.13", default-features = false, optional = true }

# Orientation is applied a band of rows per task on native; wasm stays single-threaded.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true
# EXR block (de)compression runs on the rayon pool natively; wasm stays single-threaded.
exr = { version = "1.73", default-features = false, features = ["rayon"] }
# AVIF tiles encoded in parallel on the global rayon pool.
ravif = { version = "0.13", default-features = false, features = ["threading"], optional = true }

[dev-dependencies]
proptest.workspace = true
# Oracle decoders for cross-checking in tests only.
image = { workspace = true, features = ["png", "jpeg", "tiff"] }

[lints]
workspace = true

# The browser threads build (wasm with `atomics`, packaging/web-threads) takes the rayon paths too.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }
ravif = { version = "0.13", default-features = false, features = ["threading"], optional = true }
