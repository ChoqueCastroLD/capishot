[package]
name = "photocraft-ai"
description = "Local AI runtime for Capishot: model catalog and selection, tiling with blended overlaps, weights from bytes, download cache, inference with burn on WebGPU/wgpu or the CPU"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "photocraft_ai"
path = "src/lib.rs"

[features]
default = []
# Inference (burn). Without it the crate is only the catalog, selection rules, tiling, weight
# parsing and the cache: small enough for the main web bundle.
runtime = ["dep:burn", "dep:pollster"]
# CPU inference (burn-flex: gemm, SIMD; rayon threads natively and in the threads web build).
cpu = ["runtime", "burn/flex", "burn/rayon", "burn/simd", "dep:rayon"]
# GPU inference through wgpu: Vulkan/Metal/DX12 natively, WebGPU in the browser. No burn autotune:
# its kernel trials can hit shaders a WebGPU implementation rejects (SwiftShader), which poisons
# the device for every later model.
gpu = ["runtime", "burn/wgpu"]
# The native (desktop, CLI) GPU path on top of `gpu`: burn's autotune (convolutions as implicit
# GEMMs, on tensor cores where the device has cooperative matrices) and its SPIR-V compiler for
# Vulkan; networks in f16 where the adapter has shader-f16. Never in a wasm build: the browser
# keeps `gpu` alone. Only real adapters run here (`native::pick_runtime` skips software ones).
gpu-native = ["gpu", "burn/autotune", "burn/vulkan"]
# Windows: MangaJaNai's ESRGAN and IllustrationJaNai V3's FDAT in fp32 on DirectML through ONNX
# Runtime (several times faster than burn's fp32 convolutions, same results), loaded at run
# time: `onnxruntime.dll` (a DirectML build, 1.24 or later) and `DirectML.dll` next to the
# executable or in PHOTOCRAFT_AI_ONNXRUNTIME.
# Without them, and on every other platform, the burn path runs. Never in a wasm build.
directml = ["runtime", "dep:ort"]
# Native model downloads (blocking HTTPS, rustls) for `native::NativeUpscaler`.
download = ["dep:ureq"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
half = "2"
sha2 = "0.10"
burn = { version = "0.22", default-features = false, features = ["std"], optional = true }
pollster = { version = "1", optional = true }
rayon = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
# Dynamically loaded (no download at build time, nothing linked): see the `directml` feature.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"], optional = true }

[dev-dependencies]
photocraft-ai = { path = ".", features = ["cpu"] }
image = { workspace = true, features = ["png", "jpeg"] }

[[example]]
name = "ai_bench"
required-features = ["cpu", "gpu"]

[[example]]
name = "bench_upscale"
required-features = ["cpu", "gpu"]

[lints]
workspace = true
