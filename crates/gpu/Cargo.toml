[package]
name = "photocraft-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
half = "2"
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-algo = { workspace = true }
# A feathered mask's reach (effect damage).
photocraft-vector = { workspace = true }
bytemuck = { workspace = true }
# Same major version as eframe's wgpu so the app's device can be shared.
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Effect distance fields are computed in parallel bands.
rayon = { workspace = true }

[dev-dependencies]
wgpu = { version = "30" }
pollster = "1"

# The browser threads build (wasm with `atomics`, packaging/web-threads) takes the rayon paths too.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }
