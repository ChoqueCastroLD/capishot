[package]
name = "photocraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Filter › Plug-ins (sandboxed WebAssembly plug-ins): on by default, left out of the web build.
default = ["plugins", "all-catalogs"]
plugins = ["dep:photocraft-plugins", "photocraft-engine/plugins"]
# Every translation catalog compiled in. Without it (the web build) only Spanish and Brazilian
# Portuguese are; the shell fetches the others when chosen (`i18n::take_catalog_requests`).
all-catalogs = []

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
photocraft-geom = { workspace = true }
photocraft-color = { workspace = true }
photocraft-cms = { workspace = true }
photocraft-raster = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ops = { workspace = true }
photocraft-compose = { workspace = true }
photocraft-gpu = { workspace = true }
photocraft-engine = { workspace = true }
# Image › Upscale with AI…: the model catalog and the upscaler seam (no inference).
photocraft-ai = { workspace = true }
# The TypeR panel reads the session's TypeR state (script lines, style library) to draw it.
photocraft-typer = { workspace = true }
photocraft-io = { workspace = true }
photocraft-plugins = { workspace = true, optional = true }
photocraft-algo = { workspace = true }
photocraft-text = { workspace = true }
photocraft-vector = { workspace = true }
# Only MAX_BRUSH_SIZE: `ui.set brushSize` validates against the Brush Settings range up front.
photocraft-paint = { workspace = true }
# Reading files to open them (bounded reads, a clear error for files larger than memory).
photocraft-format = { workspace = true }
# Decoding the brand mark's PNG (`brand.rs`); already linked through photocraft-io.
photocraft-codecs = { workspace = true }
egui = { workspace = true }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
# Without egui's `default_fonts` (the desktop app enables them): theme.rs installs the bundled Inter
# and JetBrains Mono plus egui's two emoji/icon fonts, so the web build carries no Ubuntu-Light or
# Hack it never draws with (0.65 MB of wasm).
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
# Just the two emoji/icon fonts from egui's default set (unused statics are not linked).
epaint_default_fonts = "0.36"
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = "0.22"
# Inflating the translation catalogs, stored deflated (build.rs); already linked through photocraft-io.
flate2 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
# Safe native UI-language APIs (Windows/macOS); no subprocess or web dependency.
sys-locale = "=0.3.2"

[dev-dependencies]
# Synthetic raw files for the open-time Camera Raw dialog tests.
photocraft-raw = { workspace = true, features = ["testgen"] }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot", "eframe"] }
# Tests keep egui's default fonts as the desktop app has them; EXR, camera raw and plug-in
# behaviour is tested as the desktop app ships it.
egui = { workspace = true, features = ["default_fonts"] }
photocraft-codecs = { workspace = true, features = ["exr"] }
photocraft-io = { workspace = true, features = ["camera-raw"] }
# Benchmark helpers for the `--json` benches `cargo xtask perf` runs (in-process RSS, percentiles).
photocraft-testkit = { workspace = true }
# Only for examples/perf_scenarios.rs (a 500-brush .abr for the #210 import row).
photocraft-psd = { workspace = true }

[build-dependencies]
# Deflates the translation catalogs (build.rs); already linked at run time to inflate them.
flate2 = { workspace = true }
serde_json = { workspace = true }
toml = "1"

# The browser threads build (wasm with `atomics`, packaging/web-threads) takes the rayon paths too.
[target.'cfg(all(target_arch = "wasm32", target_feature = "atomics"))'.dependencies]
rayon = { workspace = true }
# wgpu objects are !Send/!Sync with atomics; the GPU canvas keeps them in a main-thread SendWrapper.
send_wrapper = "0.6"
