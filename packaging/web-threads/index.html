<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Capishot</title>
  <style>
    /* The notch and home indicator (viewport-fit=cover): the app keeps its bars inside these (safe_area.rs). */
    :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; white-space: pre-line; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    #photocraft_loading.error p { color: #f0a0a0; }
  </style>
  <!-- The loader around the WebAssembly start (progress, a broken load's reason, the fall back to
       the single-threaded build): boot.js, shared with that build's page. -->
  <script src="boot.js" data-build="threads"></script>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <p id="photocraft_status">Loading Capishot&hellip;</p>
  </div>
  <script type="module">
    // Threads build (packaging/web-threads): the module shares one memory with a pool of Web
    // Workers, so the page must be cross-origin isolated (COOP + COEP, see _headers). The pool
    // is started before the app so rayon never falls back to its one-thread pool.
    const version = '__PHOTOCRAFT_VERSION__';
    // The glue, the module and the glue's snippets of this build live in v/<version>/: a page
    // from an earlier deploy keeps loading its own pair (deploy.sh keeps the previous builds).
    const dir = `./v/${version}/`;
    const boot = self.capishotBoot;
    const loading = document.getElementById('photocraft_loading');
    const status = document.getElementById('photocraft_status');
    // Where the single-threaded build sits relative to this page (build.sh: PHOTOCRAFT_WEB_FALLBACK),
    // or empty. Without cross-origin isolation (a host that doesn't send COOP + COEP, or a browser
    // that doesn't honour them), or when this build fails at any stage, the page goes there.
    const fallback = '__PHOTOCRAFT_FALLBACK__';
    self.capishotFallback = fallback;
    // The module ships gzipped (build.sh) and is inflated on its way into streaming compilation.
    // Sniff the bytes rather than trust the name: a host that serves the file with
    // Content-Encoding (br or gzip) has the browser decode it already. No time limit: a slow
    // network takes as long as it takes, with its progress on the page.
    const wasmResponse = async (url) => {
      boot.stage('wasm_download');
      const res = await fetch(url);
      if (!res.ok) { const e = new Error(`${url}: HTTP ${res.status}`); e.http = res.status; throw e; }
      const reader = res.body.getReader();
      const first = await reader.read();
      const head = first.value ?? new Uint8Array();
      const gzipped = head[0] === 0x1f && head[1] === 0x8b;
      const body = new ReadableStream({
        start(c) { if (first.done) c.close(); else c.enqueue(head); },
        async pull(c) { const { done, value } = await reader.read(); if (done) c.close(); else c.enqueue(value); },
        cancel(reason) { return reader.cancel(reason); },
      });
      const raw = boot.counted(new Response(body, { headers: { 'Content-Type': 'application/wasm' } }), gzipped);
      return new Response(gzipped ? raw.body.pipeThrough(new DecompressionStream('gzip')) : raw.body, { headers: { 'Content-Type': 'application/wasm' } });
    };
    const fail = (msg) => {
      loading.classList.add('error');
      status.textContent = msg;
    };
    const isolated = self.crossOriginIsolated === true;
    if (!isolated && fallback) {
      console.warn('photocraft-web: not cross-origin isolated; loading the single-threaded build');
      location.replace(new URL(fallback, location.href).href + location.search + location.hash);
    } else {
      try {
        if (!isolated) {
          throw new Error('This page is not cross-origin isolated, so WebAssembly threads (SharedArrayBuffer) are ' +
            'unavailable. The server must send Cross-Origin-Opener-Policy: same-origin and ' +
            'Cross-Origin-Embedder-Policy: require-corp.');
        }
        // The module's download starts with the glue's, not after it: on a phone network the
        // glue's round trip and bytes are otherwise time the module isn't downloading.
        const bust = new URLSearchParams(location.search).get('r');
        const q = bust ? `?r=${bust}` : '';
        const wasm = wasmResponse(`${dir}photocraft_bg.wasm.gz${q}`);
        wasm.catch(() => {});
        const pc = await import(`${dir}photocraft.js${q}`);
        const response = await wasm;
        await pc.default({ module_or_path: response });
        const moduleReady = Math.round(performance.now());
        // One worker per core but one (the UI thread spins while it waits for them), at most 16.
        // ?threads=N overrides it (1 runs every parallel step on one worker; useful to compare).
        const asked = Number(new URLSearchParams(location.search).get('threads'));
        const cores = navigator.hardwareConcurrency || 4;
        const threads = asked > 0 ? Math.min(Math.floor(asked), 64) : Math.max(1, Math.min(cores - 1, 16));
        // The pool and the app start together: the app gets its graphics device, fonts and presets
        // ready while the workers come up, and is built (the first thing to use rayon, which must
        // not run before the pool exists) once the page calls threadPoolReady().
        boot.stage('threads_pool');
        const pool = pc.initThreadPool(threads);
        pc.start();
        await pool;
        boot.stage('start');
        pc.threadPoolReady();
        // The module, for diagnostics: photocraftModule.parallelSelfTest(4000, 3000). Not
        // `photocraft`: the app sets window.photocraft to its embedding API once it runs.
        self.photocraftModule = pc;
        self.photocraftThreads = threads;
        console.info(`photocraft-web: module downloaded and compiled at ${moduleReady} ms, rayon pool of ${threads} Web Workers at ${Math.round(performance.now())} ms`);
      } catch (e) {
        console.error(e);
        // Any stage failed: the single-threaded build (boot.js), or the reason when there is none.
        if (boot && (isolated || fallback)) boot.fail(e);
        else fail(`Capishot could not start:\n${e && e.message ? e.message : e}`);
      }
    }
  </script>
</body>
</html>
