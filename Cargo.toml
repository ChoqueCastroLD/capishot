[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/photocraft", "apps/photocraft-cli", "xtask"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
# internal
photocraft-geom = { path = "crates/geom" }
photocraft-color = { path = "crates/color" }
photocraft-cms = { path = "crates/cms" }
photocraft-raster = { path = "crates/raster" }
photocraft-doc = { path = "crates/doc" }
photocraft-ops = { path = "crates/ops" }
photocraft-psd = { path = "crates/psd" }
# codecs (`exr`), io (`camera-raw`), engine and ui-egui (`plugins`) have default features the web
# build leaves out; members ask for them explicitly (the desktop app and CLI turn them all on).
photocraft-codecs = { path = "crates/codecs", default-features = false }
photocraft-raw = { path = "crates/raw" }
photocraft-affinity = { path = "crates/affinity" }
photocraft-adobe-assets = { path = "crates/adobe-assets" }
photocraft-compose = { path = "crates/compose" }
photocraft-gpu = { path = "crates/gpu" }
photocraft-paint = { path = "crates/paint" }
photocraft-algo = { path = "crates/algo" }
photocraft-io = { path = "crates/io", default-features = false }
photocraft-text = { path = "crates/text" }
photocraft-typer = { path = "crates/typer" }
photocraft-vector = { path = "crates/vector" }
photocraft-format = { path = "crates/format" }
photocraft-automation = { path = "crates/automation" }
photocraft-plugins = { path = "crates/plugins" }
photocraft-engine = { path = "crates/engine", default-features = false }
photocraft-fontfetch = { path = "crates/fontfetch" }
photocraft-ui-egui = { path = "crates/ui-egui", default-features = false }
photocraft-testkit = { path = "crates/testkit" }
photocraft-tablet = { path = "crates/tablet" }
# Local AI runtime; the engine and the main web bundle use only its core (no features).
photocraft-ai = { path = "crates/ai" }
# Manga LaMa inpainting; without features only its tiling half (the model runs elsewhere).
photocraft-ai-lama = { path = "crates/ai-lama", default-features = false }
# Generative Fill (SD 1.5 inpainting); without features only its prompt, crop, schedulers and service seam.
photocraft-ai-sd = { path = "crates/ai-sd", default-features = false }

# external
# Capishot's PSD renderer (MIT): writes the merged image of PSDs and powers File › Export › Compile.
psd-compiler = { git = "https://github.com/ChoqueCastroLD/psd-compiler-cli", rev = "70644ac", default-features = false }
photocraft-ipp = { path = "crates/ipp" }

# external
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "3d37da389a3618ab9b76109da11416e9ca4ea719" }
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
arc-swap = "1"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs", "runtime_detection"] }
image = { version = "0.25", default-features = false }
# Baseline-JPEG decode of lossy DNG tiles (compression 34892), shared with zune-jpeg.
zune-core = "0.5"
zune-jpeg = "0.5"
proptest = "1"
eframe = { version = "0.36", default-features = false }
# Without `default_fonts`, which embeds egui's fonts uncompressed: ui-egui ships them deflated
# (egui_fonts.rs; the web build's size gate).
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
log = "0.4"
rayon = "1"
criterion = { version = "0.5", default-features = false }
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
# Line tables keep file:line in panic backtraces but drop variable info, which roughly halves link
# time and PDB size for the ~260 test binaries (#2204). CI sets the same through
# CARGO_PROFILE_DEV_DEBUG (and no debuginfo at all for the Windows tests). To inspect locals in a
# debugger, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Test builds compile ui-egui without optimization: its library and unit tests were the biggest
# test-build units after engine's (12.6 of ~63 compile minutes on the Windows CI runner), and its
# tests run no heavier pixel code of their own (that lives in the crates that stay optimized).
# Measured on CI: Windows build 18.9 -> 15.4 min, test run 10.0 -> 10.5. `cargo run` and
# `cargo build` use the dev profile and are unaffected.
[profile.test.package.photocraft-ui-egui]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (apps/photocraft-web, `data-cargo-profile` in its index.html). Hosts cap the
# size of a single file (Cloudflare Pages/Workers: 25 MiB), and the wasm is downloaded on every
# visit, so this profile optimizes for size: fat LTO, opt-level "z" for PhotoCraft's own crates,
# "s" for dependencies and for the crates that decode files, and 3 for pixel processing (filters
# and compositing). Dependencies stay at "s": at "z" the whole wasm grows (by 0.4 MB, measured).
# panic stays the target default (wasm32-unknown-unknown aborts; AGENTS.md's `panic = "unwind"`
# is for the native app shell). packaging/web/package.sh fails the build above 24 MiB.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "z"

# Decoding and rasterizing keep their speed.
[profile.wasm-release.package.photocraft-codecs]
opt-level = "s"
[profile.wasm-release.package.photocraft-raw]
opt-level = "s"
[profile.wasm-release.package.photocraft-heif]
opt-level = "s"
[profile.wasm-release.package.photocraft-vector]
opt-level = "s"

# Large crates off the per-frame and per-pixel paths: the document model, file parsers run once
# per open/save, JSON (settings, presets, control channel), SVG parsing, and shader translation
# (runs when a pipeline is created). "z" keeps the wasm well under the size gate.
[profile.wasm-release.package.photocraft-doc]
opt-level = "z"
[profile.wasm-release.package.photocraft-psd]
opt-level = "z"
[profile.wasm-release.package.photocraft-format]
opt-level = "z"
[profile.wasm-release.package.photocraft-affinity]
opt-level = "z"
[profile.wasm-release.package.serde_json]
opt-level = "z"
[profile.wasm-release.package.usvg]
opt-level = "z"
[profile.wasm-release.package.naga]
opt-level = "z"

# Browser command dispatch and image preparation trade some speed for a smaller bundle.
# Native profiles and the speed-oriented pixel-core profiles below are unchanged.
[profile.wasm-release.package.photocraft-engine]
opt-level = "z"

# The browser UI toolkit favors size to stay within the WebAssembly upload budget.
[profile.wasm-release.package.egui]
opt-level = "z"
[profile.wasm-release.package.epaint]
opt-level = "z"
[profile.wasm-release.package.eframe]
opt-level = "z"

# Pixel processing keeps its speed-oriented optimization level. Capishot composites on the CPU
# when a device has no usable GPU (the CPU canvas, phones and low-end laptops) and runs filters in
# the browser, so compose, algo and cms stay at 3 (the threads build is well under the size gate).
[profile.wasm-release.package.photocraft-raster]
opt-level = 3
[profile.wasm-release.package.photocraft-color]
opt-level = 3
[profile.wasm-release.package.photocraft-cms]
opt-level = 3
[profile.wasm-release.package.photocraft-compose]
opt-level = 3
[profile.wasm-release.package.photocraft-algo]
opt-level = 3
[profile.wasm-release.package.photocraft-paint]
opt-level = 3

# The AI Web Worker (packaging/web-ai/build.sh): loaded only when a model runs and cached. The
# CPU kernels (burn-flex, gemm, macerator, pulp) and the networks are built for speed, opt-level 3
# (15-20 % faster on one thread than wasm-release's "z"); the rest (the WebGPU stack: wgpu, cubecl's kernel
# generators) for size, so the plain worker stays under the 24 MiB per-file limit.
[profile.wasm-ai]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-ai.package."*"]
opt-level = "s"
[profile.wasm-ai.package.burn-flex]
opt-level = 3
[profile.wasm-ai.package.gemm]
opt-level = 3
[profile.wasm-ai.package.gemm-common]
opt-level = 3
[profile.wasm-ai.package.gemm-f32]
opt-level = 3
[profile.wasm-ai.package.gemm-f16]
opt-level = 3
[profile.wasm-ai.package.pulp]
opt-level = 3
[profile.wasm-ai.package.macerator]
opt-level = 3
[profile.wasm-ai.package.burn-backend]
opt-level = 3
[profile.wasm-ai.package.burn-std]
opt-level = 3
[profile.wasm-ai.package.burn-tensor]
opt-level = 3
[profile.wasm-ai.package.burn-dispatch]
opt-level = 3
[profile.wasm-ai.package.rayon]
opt-level = 3
[profile.wasm-ai.package.rayon-core]
opt-level = 3
[profile.wasm-ai.package.half]
opt-level = 3
[profile.wasm-ai.package.photocraft-ai]
opt-level = 3
[profile.wasm-ai.package.photocraft-ai-lama]
opt-level = 3
[profile.wasm-ai.package.photocraft-ai-worker]
opt-level = 3
