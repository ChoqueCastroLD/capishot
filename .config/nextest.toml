# Refuse to run under a nextest older than the fixed release: GHSA-vc25-qg58-w57c is fixed in
# 0.9.150, and CI installs exactly that version (an older nextest exits 92 REQUIRED_VERSION_NOT_MET).
nextest-version = "0.9.150"

# cargo-nextest (https://nexte.st): runs every test in its own process, in parallel across test
# binaries. CI runs it with the `ci` profile below (#6117); locally it is optional and `cargo test`
# keeps working (#2204).
#
#   cargo nextest run --workspace        # all tests except doctests
#   cargo test --doc --workspace         # nextest does not run doctests
#
# GPU tests: each test is its own process here, so the in-process `gpu_lock()` mutexes no longer
# serialize them. Too many concurrent wgpu devices time out (`PollError: ... Wait timed out`), so
# this group caps them at 4.
[test-groups]
gpu = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(photocraft-gpu) | (package(photocraft-ui-egui) & (kind(test) | test(/canvas|gpu|mip|type_tool|background_redraw::|floating_group_titles|swap_arrow::tests::rendered_glyph/)))'
test-group = 'gpu'

# CI (`--profile ci`, .github/workflows/ci.yml). Stops at the first failure so a red PR frees its
# runner, fails a test that hangs instead of letting it hold the runner, and repeats every failure
# at the end of the log. The default profile's GPU override still applies.
[profile.ci]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

# The gate before publishing (/root/capi-workers/bin/fasttest.sh): every core, without the slowest
# tests (over 5 s each on the server; the full suite still runs them) and without the ones that
# need a real GPU or are timing-sensitive on a loaded machine.
# Plus every test over 1 s in a run (bin/nx-slow.py in capi-workers): the publish gate stays fast;
# the full suite of each version still runs them.
[profile.fast]
test-threads = "num-cpus"
