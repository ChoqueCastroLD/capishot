# Refuse to run under a nextest older than the fixed release: GHSA-vc25-qg58-w57c is fixed in
# 0.9.150, and CI installs exactly that version (an older nextest exits 92 REQUIRED_VERSION_NOT_MET).
nextest-version = "0.9.150"

# cargo-nextest (https://nexte.st): runs every test in its own process, in parallel across test
# binaries. CI runs it with the `ci` profile below (#6117); locally it is optional and `cargo test`
# keeps working (#2204).
#
#   cargo nextest run --workspace        # all tests except doctests
#   cargo test --doc --workspace         # nextest does not run doctests
#
# GPU tests: each test is its own process here, so the in-process `gpu_lock()` mutexes no longer
# serialize them. Too many concurrent wgpu devices time out (`PollError: ... Wait timed out`), so
# this group caps them at 4.
[test-groups]
gpu = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(photocraft-gpu) | (package(photocraft-ui-egui) & (kind(test) | test(/canvas|gpu|mip|type_tool|background_redraw::|floating_group_titles|swap_arrow::tests::rendered_glyph/)))'
test-group = 'gpu'

# CI (`--profile ci`, .github/workflows/ci.yml). Stops at the first failure so a red PR frees its
# runner, fails a test that hangs instead of letting it hold the runner, and repeats every failure
# at the end of the log. The default profile's GPU override still applies.
[profile.ci]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

# The gate before publishing (/root/capi-workers/bin/fasttest.sh): every core, without the slowest
# tests (over 5 s each on the server; the full suite still runs them) and without the ones that
# need a real GPU or are timing-sensitive on a loaded machine.
[profile.fast]
test-threads = "num-cpus"
default-filter = "not (binary(=canvas_lod) | test(=canvas::cpu_background_tests::omitting_an_occluded_checker_preserves_cpu_canvas_pixels) | test(=canvas::cpu_background_tests::pattern_preview_keeps_the_legacy_checker_for_every_copy) | test(=canvas::gpu_canvas::mip_tests::canvas_mips_preserve_opaque_pixels_and_partial_updates) | test(=canvas::tests::gpu_display_luts_are_per_display) | test(=canvas_16f::sixteen_bit_canvas_too_big_for_floats_stays_on_the_gpu_in_8_bit) | test(=display_shadows::gpu_display_shadows_match_independent_icc_reference_at_all_depths) | test(=full_res_preview::adjustment_dialog_zoomed_out_skips_the_reduced_copy_when_low_res_is_off) | test(=full_res_preview::adjustment_layer_drag_previews_at_full_resolution_when_low_res_is_off) | test(=gpu_device_loss::composite_reuse_reports_held_bytes_and_honors_the_canvas_override) | test(=navigator_gpu_tests::navigator_draws_the_gpu_canvas_texture_and_follows_edits) | test(=telemetry::tests::the_app_counts_each_dispatch_once_with_its_source) | test(=typer::shaper_ui::tests::tiles_apply_the_shape_and_shift_also_advances) | test(=canvas::cam_preview::tests::a_large_selection_shows_a_coarse_result_then_the_exact_one) | test(=canvas::gpu_canvas::mip_tests::canvas_mips_preserve_opaque_pixels_and_partial_updates) | test(=canvas_menu_tests::brush_picker_taps_preserve_pixels_selection_and_history_after_reopening) | test(=canvas_menu_tests::secondary_taps_keep_canvas_layer_menus_open) | test(=canvas_menu_tests::secondary_taps_keep_selection_menus_open) | test(=dialogs::adjust_editors::ui_tests::every_adjustment_layer_edits_through_properties) | test(=dialogs::filter_dialog::tests::every_dialog_default_runs_without_float_type_errors) | test(=dialogs::filter_dialog::tests::every_preview_shows_what_ok_applies) | test(=dialogs::gallery_ui::tests::zoom_shortcuts_zoom_the_preview_not_the_canvas) | test(=dialogs::sizing::tests::linked_dimension_edits_bound_both_axes_proportionally) | test(=dock::tests::tab_strips_never_overlap_the_menu_button) | test(=dock::tests::theme_switch_keeps_the_selected_color_group_panel) | test(=input::shortcut_dispatch::tests::every_displayed_shortcut_dispatches_from_where_focus_usually_is) | test(=menus::menu_nav::tests::every_row_of_the_longest_menus_is_reachable_with_the_arrow_keys) | test(=panels::brush_sections::tests::transfer_mixer_controls_follow_the_tool_and_section_in_every_theme) | test(=panels::brushes_tab::tests::dragging_a_brush_shows_its_tip_preview) | test(=panels::clipping_indicator_tests::adjustment_scope_control_fits_compact_properties_before_scrolling) | test(=panels::compact_visual_regressions::compact_toolbar_tab_reveals_and_activates_the_last_tool) | test(=panels::compact_visual_regressions::tab_focus_reveals_the_final_narrow_tool_option) | test(=panels::smart_ui::editor_tests::names_and_blend_icons_have_separate_double_click_targets_and_no_overlap) | test(=phone_dialog_tests::every_dialog_keeps_ok_and_cancel_on_a_phone) | test(=tool_cycle_tests::letters_typed_into_text_never_switch_tools) | test(=tool_options_theme_tests::every_theme_shows_the_same_tool_options) | test(=tools::crop_ui::tests::commit_passes_the_fill_choice) | test(=tools::font_finder_ui::tests::a_click_takes_a_square_and_a_drag_its_rectangle) | test(=tools::magnetic_lasso_ui::tests::hostile_input_never_panics) | test(=tools::type_tool::canvas_tests::clicks_and_drags_land_on_the_glyph_under_the_pointer) | test(=tools::type_tool::canvas_tests::every_paragraph_box_handle_resizes_the_box_with_snapping_on) | test(=tools::type_tool::canvas_tests::temporary_type_transform_scales_without_reflow_or_leaving_type) | test(=tools::type_tool::font_commit_tests::caret_font_choices_style_only_subsequent_typing_including_ime) | test(=tools::type_tool::font_commit_tests::global_commit_accepts_pending_font_queries_and_leaves_no_focused_field) | test(=tools::type_tool::font_commit_tests::selected_fonts_apply_and_survive_commit_across_controls_and_acceptance_methods))"

[profile.fast.junit]
path = "junit.xml"
